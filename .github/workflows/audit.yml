# Known vulnerabilities in production dependencies. Separate from CI on purpose: an advisory published today must
# not block an unrelated deploy of master; it shows up here (weekly, on dependency pull requests, or on demand),
# and Dependabot opens the fix.
name: Dependency audit

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths: [package.json, package-lock.json, 'apps/*/package.json', 'packages/*/package.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: No known high-severity vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
