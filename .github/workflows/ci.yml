# Every push and pull request: the same checks as before a hand-off. Railway waits for this workflow
# ("Wait for CI") and deploys a commit only when it passes.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production dependencies have no known high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high
