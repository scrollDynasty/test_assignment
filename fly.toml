# Fly.io: one machine + one volume. SQLite is a single-writer file database, so the app must not scale out.
app = "funnel-runtime-scroll"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/funnel.db"

[mounts]
  source = "funnel_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a reviewer should never hit a cold start, and in-memory caches stay warm.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
